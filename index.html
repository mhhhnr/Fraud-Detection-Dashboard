.app{background:#fff;border-radius:34px;display:flex;min-height:calc(100vh - 56px);max-width:1500px;margin:auto;box-shadow:0 20px 60px #0002;overflow:hidden}
aside{width:84px;padding:26px 0;display:flex;flex-direction:column;align-items:center;gap:12px;border-right:1px solid var(--ln)}
.logo{width:44px;height:44px;border-radius:14px;background:var(--b);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;margin-bottom:26px}
aside a{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;color:var(--m);text-decoration:none;font-size:20px;position:relative}
aside a.on{background:var(--b);color:#fff}aside a:hover::after{content:attr(data-t);position:absolute;left:58px;background:var(--ink);color:#fff;font-size:12px;padding:4px 9px;border-radius:8px;white-space:nowrap;z-index:9}
.main{flex:1;padding:26px 34px 40px;min-width:0}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-weight:400;font-size:34px;margin:0;letter-spacing:-.5px}.top .sub{color:var(--m);font-size:17px}
.sp{flex:1}.search{display:flex;align-items:center;background:var(--card);border-radius:999px;padding:4px 4px 4px 16px;border:1px solid var(--ln)}
.search input{border:0;background:none;outline:0;font:inherit;width:230px}.search button{background:var(--b);color:#fff;border:0;border-radius:999px;padding:9px 18px;font:inherit;font-weight:500;cursor:pointer}
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:4px;border:1px solid var(--ln);gap:2px}
.seg a,.seg button{padding:9px 20px;border-radius:999px;color:var(--ink);text-decoration:none;font:inherit;border:0;background:none;cursor:pointer}
.seg .on{background:var(--b);color:#fff}
.grid{display:grid;gap:16px;margin-bottom:16px}.g5{grid-template-columns:repeat(5,1fr)}.g2{grid-template-columns:1.5fr 1fr}.g3{grid-template-columns:1fr 1fr 1.2fr}
.card{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:20px 22px;min-width:0}
.card h3{margin:0 0 12px;font-size:16px;font-weight:600}.card h3 small{font-weight:400;color:var(--m);margin-left:6px}
.kpi .l{color:var(--m);font-size:14px}.kpi .v{font-size:34px;font-weight:600;letter-spacing:-1px;margin-top:6px}.kpi .v.b{color:var(--b)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-weight:600;padding:7px 4px}td{padding:7px 4px;border-top:1px solid var(--ln)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;font-size:13px;text-align:center;align-items:stretch}.cm .c{border-radius:14px;padding:16px 6px;color:#fff}.cm .c b{display:block;font-size:20px}.cm .h{color:var(--m);align-self:center;padding:0 4px}

.res{display:grid;grid-template-columns:260px 1fr;gap:26px;align-items:center}
.pill{display:inline-block;padding:7px 18px;border-radius:999px;font-weight:600;font-size:22px}.pill.f{background:var(--b);color:#fff}.pill.l{background:#e4f4ec;color:#157a52}

function hbar(el,data,color){const W=420,R=30,H=data.length*R+4,mx=d3.max(data,d=>d[1]),s=d3.select(el).append('svg').attr('viewBox',`0 0 ${W} ${H}`).attr('width','100%');
data.forEach((d,i)=>{const w=d[1]/mx*(W-210);s.append('text').attr('x',0).attr('y',i*R+19).attr('font-size',12.5).text(d[0].length>24?d[0].slice(0,23)+'…':d[0]);s.append('rect').attr('x',170).attr('y',i*R+4).attr('height',20).attr('rx',6).attr('width',0).attr('fill',color).transition().duration(700).attr('width',w);s.append('text').attr('x',176+w).attr('y',i*R+19).attr('font-size',11.5).attr('fill','#7c7479').text(d[1])})}
function tree(el){const W=560,H=330,root=d3.hierarchy(S.tree,d=>[d.l,d.r].filter(Boolean)),lay=d3.tree().size([H-30,W-130])(root),sc=d3.scaleLinear([0,.5,1],['#fff','#e0a9b8','#7B1E3A']),s=d3.select(el).append('svg').attr('viewBox',`0 0 ${W} ${H}`).attr('width','100%').append('g').attr('transform','translate(24,15)');
s.selectAll('path').data(root.links()).join('path').attr('fill','none').attr('stroke','#cdbfc4').attr('d',d3.linkHorizontal().x(d=>d.y).y(d=>d.x));
const n=s.selectAll('g').data(root.descendants()).join('g').attr('transform',d=>`translate(${d.y},${d.x})`);n.append('circle').attr('r',d=>Math.max(5,Math.min(13,Math.log10(d.data.s)*2.1))).attr('fill',d=>sc(d.data.f)).attr('stroke','#7B1E3A').append('title').text(d=>`${num(d.data.s)} samples · ${pc(d.data.f)} fraud`);
n.append('text').attr('y',-12).attr('x',-4).attr('font-size',10).attr('fill','#161216').text(d=>d.data.n?`${d.data.n} ≤ ${d.data.t}`:pc(d.data.f,0)+' fraud')}
function cm(el){const [tn,fp,fn,tp]=S[model].cm,mx=Math.sqrt(Math.max(tn,fp,fn,tp)),c=v=>`rgba(123,30,58,${.18+.82*Math.sqrt(v)/mx})`,cell=(v,l,dark)=>`<div class="c" style="background:${c(v)};${dark?'':'color:#161216'}"><b>${num(v)}</b>${l}</div>`;
el.innerHTML=`<div class="seg" style="margin-bottom:12px">${MN.map(n=>`<button class="${n==model?'on':''}" data-m="${n}" style="padding:6px 12px;font-size:12.5px">${n=='Logistic Regression'?'Logistic':n=='Random Forest'?'RF':n}</button>`).join('')}</div>
<div class="cm"><span></span><span class="mut">Pred. legit</span><span class="mut">Pred. fraud</span><span class="h">Actual<br>legit</span>${cell(tn,'True negative',1)}${cell(fp,'False positive',1)}<span class="h">Actual<br>fraud</span>${cell(fn,'False negative',1)}${cell(tp,'True positive',1)}</div>`;
el.querySelectorAll('button').forEach(b=>b.onclick=()=>{model=b.dataset.m;cm(el)})}
// ---------- pages ----------
function overview(){const x=S.XGBoost,[tn,fp,fn,tp]=x.cm,pr=tp/(tp+fp),rc=tp/(tp+fn);$('#ttl').textContent='Fraud Detection Overview';$('#sub').textContent=`XGBoost on ${num(x.n)} held-out transactions`;
app.innerHTML=`<div class="grid g5">${[['Transactions evaluated',num(x.n)],['Actual fraud rate',x.actual+'%'],['Precision',pc(pr)],['Recall',pc(rc)],['ROC-AUC','0.897']].map((k,i)=>`<div class="card kpi"><div class="l">${k[0]}</div><div class="v ${i==1?'b':''}">${k[1]}</div></div>`).join('')}</div>
<div class="grid g2"><div class="card"><h3>Fraud probability distribution<small>XGBoost · sqrt scale</small></h3><div id="h"></div><div class="mut"><span class="dot" style="background:#d9cfd3"></span>Legitimate <span class="dot" style="background:#7B1E3A;margin-left:14px"></span>Fraud</div></div>
<div class="card"><h3>Overall fraud percentage</h3><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div id="d" style="width:200px"></div><table style="flex:1;min-width:190px"><tr><th>Measure</th><th>Rate</th></tr><tr><td><span class="dot" style="background:#7B1E3A"></span>Actual fraud</td><td>${x.actual}%</td></tr>${MN.map(n=>`<tr><td><span class="dot" style="background:${MC[n]}"></span>${n} flags</td><td>${S[n].flag}%</td></tr>`).join('')}</table></div></div></div>
<div class="grid g3"><div class="card"><h3>ROC curves</h3><div id="r"></div><div class="mut">${MN.map(n=>`<span class="dot" style="background:${MC[n]}"></span>${n} `).join('')}</div></div>
<div class="card"><h3>Confusion matrix</h3><div id="c"></div></div>
<div class="card"><h3>Random forest · tree 1<small>${S.rf.trees} trees, top 3 levels</small></h3><div id="t"></div><div class="mut">Darker node = higher share of fraud. Size = samples reaching it.</div></div></div>
<div class="grid" style="grid-template-columns:1fr 1fr"><div class="card"><h3>Top features · SHAP<small>mean |SHAP|, XGBoost</small></h3><div id="s1"></div></div><div class="card"><h3>Top features · Random forest<small>impurity importance</small></h3><div id="s2"></div></div></div>
<div class="card"><h3>Model comparison</h3><table><tr><th>Model</th><th>Precision</th><th>Recall</th><th>F1</th><th>PR-AUC</th><th>ROC-AUC</th></tr>${[['XGBoost',.527,.466,.495,.514,.897],['Random Forest',.498,.396,.441,.445,.862],['Logistic Regression',.193,.288,.231,.147,.787]].map(r=>`<tr><td><span class="dot" style="background:${MC[r[0]]}"></span>${r[0]}</td>${r.slice(1).map(v=>`<td>${v.toFixed(3)}</td>`).join('')}</tr>`).join('')}</table></div>`;
hist('#h');donut('#d',x.actual/100,200,'#7B1E3A',x.actual+'%','of all payments');roc('#r');cm($('#c'));tree('#t');hbar('#s1',S.shap,'#7B1E3A');hbar('#s2',S.rfimp,'#d68aa0')}
const bigDonut=(c,sz)=>{const f=c.predicted==1;donut('#g',c.probability,sz,f?'#7B1E3A':'#1f9d6b',(c.probability*100<10?(c.probability*100).toFixed(2):(c.probability*100).toFixed(1))+'%','fraud probability',TH)};
const status=c=>{const f=c.predicted==1;return `<span class="pill ${f?'f':'l'}">${f?'FRAUDULENT':'LEGITIMATE'}</span><div class="mut" style="margin-top:10px">Transaction ID ${c.transaction_id} · amount $${c.amount.toLocaleString(undefined,{minimumFractionDigits:2})}</div><div class="mut">Alert level ${pc(TH)} (black tick): scores above it are flagged.</div>`};
function viewA(c){return `<div class="card res"><div id="g"></div><div>${status(c)}</div></div>`}
function viewB(c){const F=c.features,m=Math.max(...F.map(f=>Math.abs(f.shap)));
return `<div class="card res"><div id="g"></div><div>${status(c)}<div class="mut" style="margin-top:8px">Model: XGBoost · output: log-odds → probability · base alert level ${TH}</div></div></div>
<div class="card" style="margin-top:16px"><h3>SHAP feature contributions<small>top 5, log-odds</small></h3>${F.map(f=>`<div class="sh"><span>${f.name} = ${fmt(f.value)}</span><div class="tr"><div class="bar" style="width:${Math.abs(f.shap)/m*50}%;${f.shap>0?'left:50%;background:#7B1E3A':`right:50%;background:#444`}"></div></div><b>${f.shap>0?'+':''}${f.shap.toFixed(3)}</b></div>`).join('')}<div class="mut">Burgundy pushes toward fraud, dark grey toward legitimate.</div></div>
<div class="card" style="margin-top:16px;overflow-x:auto"><table><tr><th>Rank</th><th>Feature</th><th>Value</th><th>SHAP</th><th>Direction</th></tr>${F.map((f,i)=>`<tr><td>${i+1}</td><td>${f.name}</td><td>${fmt(f.value)}</td><td>${f.shap>0?'+':''}${f.shap.toFixed(4)}</td><td>${f.shap>0?'Towards fraud':'Towards legitimate'}</td></tr>`).join('')}</table></div>`}
function viewC(c){const f=c.predicted==1,T=c.features.slice(0,3),m=Math.abs(T[0].shap),p=(c.probability*100).toFixed(1);
return `<div class="card res"><div id="g"></div><div>${status(c)}</div></div><div class="sum" style="margin-top:16px">${f?`This payment was flagged because its score (${p}%) is above the alert level.`:`This payment was <b>not</b> flagged: its score (${p}%) is below the alert level.`} The biggest push came from <b>${label(T[0].name)}</b>.</div>
<h3 style="font-weight:600">Main reasons behind the score</h3><div class="why">${T.map((x,i)=>`<div class="card ${x.shap>0?'':'dn'}"><div class="r">REASON ${i+1}</div><div class="t">${label(x.name)}</div><div>Value for this payment: <b>${fmt(x.value)}</b></div><div class="mut" style="margin-top:6px">${desc(x.name)}</div><span class="tag">${x.shap>0?'Raises':'Lowers'} the score · ${strength(x.shap,m)} influence</span></div>`).join('')}</div>
<p class="mut">About 3.5% of all payments in the data are fraud. A field raising or lowering the score does not mean the customer did something specific; anonymised fields have no known real-world meaning.</p>`}
const VF={A:viewA,B:viewB,C:viewC};
async function lookup(id){if(!META)META=await (await fetch('data/meta.json')).json();const b=Math.floor(id/META.bucket);
if(!shards[b])shards[b]=fetch(`data/${b}.json`).then(r=>r.ok?r.json():{}).catch(()=>null);const sh=await shards[b];if(sh===null){delete shards[b];throw 0}
const r=sh[id];if(!r)return null;const f=[];for(let i=0;i<15;i+=3)f.push({name:META.names[r[5][i]],value:r[5][i+1],shap:r[5][i+2]});
return{transaction_id:id,probability:r[0],predicted:r[1],amount:r[2],actual:r[3]<0?null:r[3],source:SRC[r[4]],features:f}}
const ICON={overview:'⌂',A:'◎',B:'⚙',C:'✎'},TIP={overview:'Overview',A:'Score only',B:'Technical',C:'Explanation'};
async function route(){const[,v0,k0]=(location.hash||'#/overview').split('/'),v=v0=='overview'||VIEWS[v0]?v0:'overview',k=k0||'TP';
$('#nav').innerHTML=`<div class="logo">F</div>`+Object.keys(TIP).map(x=>`<a data-t="${TIP[x]}" href="#/${x=='overview'?x:x+'/'+(v=='overview'?'TP':k)}" class="${x==v?'on':''}">${ICON[x]}</a>`).join('');
if(v=='overview'){overview();return}
const isId=/^\d+$/.test(k);$('#ttl').textContent=VIEWS[v]+' view';$('#sub').textContent=isId?'Transaction lookup':'Representative cases';
const bar=`<div class="seg" style="margin-bottom:16px">${Object.keys(VIEWS).map(x=>`<a href="#/${x}/${k}" class="${x==v?'on':''}">${VIEWS[x]}</a>`).join('')}</div>`,
chips=`<div class="chips">${Object.keys(CASES).map(x=>`<a href="#/${v}/${x}" class="${x==k?'on':''}">${{TP:'True positive',TN:'True negative',FP:'False positive',FN:'False negative'}[x]}</a>`).join('')}${isId?`<a class="on">Searched: ${k}</a>`:''}</div>`;
let c=null,note='';if(isId){app.innerHTML=bar+chips+'<div class="msg">Looking up '+k+'…</div>';try{c=await lookup(+k);if(!c)note=`<div class="msg">Transaction ID <b>${k}</b> was not found in train_transaction.csv or test_transaction.csv.</div>`}catch(e){note='<div class="msg">Could not load the data files. Open this page through a web server (see README), not by double-clicking the file.</div>'}}else c=CASES[k]||CASES.TP;
app.innerHTML=bar+chips+(note||VF[v](c))+(c&&isId?`<details><summary>Dataset info</summary><p>Source: ${c.source}<br>Actual label: <b>${c.actual==null?'unknown (Kaggle test set has no labels)':c.actual?'Fraud':'Legitimate'}</b> · Model: <b>${c.predicted?'Fraud':'Legitimate'}</b></p></details>`:'');
if(c&&!note)bigDonut(c,v=='A'?260:220);scrollTo(0,0)}
$('#sf').onsubmit=e=>{e.preventDefault();const q=$('#q').value.trim();if(!/^\d+$/.test(q)){alert('Enter a numeric Transaction ID');return}const v=location.hash.split('/')[1];location.hash=`#/${VIEWS[v]?v:'A'}/${q}`;$('#q').blur()};
addEventListener('hashchange',route);route();
</script></body></html>
